# Generated by scaffold-precommit — review, then run: pre-commit autoupdate
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: swift-test
        name: swift test
        # pre-commit's GIT_INDEX_FILE etc. break SwiftPM's dependency checkout.
        entry: env -u GIT_INDEX_FILE -u GIT_DIR -u GIT_WORK_TREE swift test
        language: system
        files: \.swift$|^Sources/.*\.json$|^Package\.
        pass_filenames: false
